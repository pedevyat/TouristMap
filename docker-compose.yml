version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine  
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=wikiturist_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=your_secure_password
    ports:
      - "5432:5432"
  backend:
    build: ./tourist-map-django 
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./tourist-map-django:/app 
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://postgres:your_secure_password@db:5432/wikiturist_db
      - DJANGO_SETTINGS_MODULE=touristmap.settings
    depends_on:
      - db
  frontend:
    build: ./tourist-map-client 
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: